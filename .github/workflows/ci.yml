name: android-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      # Sin keystore.properties en CI la release sale sin firmar; el build
      # sigue validando R8/minify/shrinkResources, que es lo que se rompe.
      - name: Release bundle (R8 smoke test)
        run: ./gradlew :app:bundleRelease --stacktrace
